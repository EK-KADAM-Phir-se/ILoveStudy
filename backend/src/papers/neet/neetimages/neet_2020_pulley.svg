<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="220">
  <rect width="340" height="260" fill="#0f172a" rx="16"/>
  <!-- Support & Pulley -->
  <line x1="170" y1="20" x2="170" y2="60" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="170" cy="75" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="170" cy="75" r="4" fill="#38bdf8"/>

  <!-- Left Mass 4 kg -->
  <line x1="148" y1="75" x2="148" y2="140" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="128" y="140" width="40" height="35" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="4"/>
  <text x="148" y="162" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">4 kg</text>

  <!-- Right Mass 6 kg -->
  <line x1="192" y1="75" x2="192" y2="170" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="172" y="170" width="40" height="40" fill="#1e293b" stroke="#a855f7" stroke-width="2" rx="4"/>
  <text x="192" y="195" fill="#a855f7" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">6 kg</text>
  
  <text x="170" y="240" fill="#f59e0b" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">a = (6-4)g / (6+4) = g/5</text>
</svg>