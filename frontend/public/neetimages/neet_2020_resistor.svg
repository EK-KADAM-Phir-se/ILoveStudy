<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="100%" height="150">
  <rect width="420" height="180" fill="#0f172a" rx="16"/>
  <!-- Resistor body -->
  <line x1="40" y1="90" x2="100" y2="90" stroke="#94a3b8" stroke-width="4"/>
  <rect x="100" y="55" width="220" height="70" fill="#334155" stroke="#64748b" stroke-width="2" rx="10"/>
  <line x1="320" y1="90" x2="380" y2="90" stroke="#94a3b8" stroke-width="4"/>

  <!-- Bands: Yellow(4), Violet(7), Brown(x10), Gold(5%) -->
  <rect x="130" y="55" width="16" height="70" fill="#eab308"/>
  <rect x="170" y="55" width="16" height="70" fill="#a855f7"/>
  <rect x="210" y="55" width="16" height="70" fill="#78350f"/>
  <rect x="270" y="55" width="16" height="70" fill="#fbbf24"/>

  <!-- Labels -->
  <text x="138" y="145" fill="#eab308" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Yellow (4)</text>
  <text x="178" y="145" fill="#a855f7" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Violet (7)</text>
  <text x="218" y="145" fill="#ca8a04" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Brown (10¹)</text>
  <text x="278" y="145" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Gold (5%)</text>
  <text x="210" y="35" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">R = 470 Ω ± 5%</text>
</svg>