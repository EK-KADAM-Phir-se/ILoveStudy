<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="100%" height="150">
  <rect width="420" height="180" fill="#0f172a" rx="16"/>
  <!-- Input A with NOT -->
  <text x="30" y="65" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="15">A</text>
  <line x1="50" y1="60" x2="80" y2="60" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="80,48 115,60 80,72" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="120" cy="60" r="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <line x1="125" y1="60" x2="190" y2="75" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Input B with NOT -->
  <text x="30" y="125" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="15">B</text>
  <line x1="50" y1="120" x2="80" y2="120" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="80,108 115,120 80,132" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="120" cy="120" r="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <line x1="125" y1="120" x2="190" y2="105" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- NOR Gate -->
  <path d="M190 60 Q215 90 190 120 Q230 120 260 90 Q230 60 190 60 Z" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="265" cy="90" r="4" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <line x1="270" y1="90" x2="340" y2="90" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="355" y="95" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="16">Y = A · B (AND)</text>
</svg>