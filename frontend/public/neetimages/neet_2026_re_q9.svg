<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="180">
  <rect width="340" height="220" fill="#0f172a" rx="16"/>
  <!-- Top branch: P and Q in series -->
  <line x1="70" y1="60" x2="115" y2="60" stroke="#94a3b8" stroke-width="2"/>
  <line x1="115" y1="45" x2="115" y2="75" stroke="#38bdf8" stroke-width="3"/>
  <line x1="125" y1="45" x2="125" y2="75" stroke="#38bdf8" stroke-width="3"/>
  <text x="120" y="35" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">P (C)</text>
  <line x1="125" y1="60" x2="215" y2="60" stroke="#94a3b8" stroke-width="2"/>
  <line x1="215" y1="45" x2="215" y2="75" stroke="#38bdf8" stroke-width="3"/>
  <line x1="225" y1="45" x2="225" y2="75" stroke="#38bdf8" stroke-width="3"/>
  <text x="220" y="35" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Q (C)</text>
  <line x1="225" y1="60" x2="270" y2="60" stroke="#94a3b8" stroke-width="2"/>

  <!-- Middle branch: S in parallel -->
  <line x1="70" y1="120" x2="165" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="165" y1="105" x2="165" y2="135" stroke="#f59e0b" stroke-width="3"/>
  <line x1="175" y1="105" x2="175" y2="135" stroke="#f59e0b" stroke-width="3"/>
  <text x="170" y="95" fill="#f59e0b" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">S (C)</text>
  <line x1="175" y1="120" x2="270" y2="120" stroke="#94a3b8" stroke-width="2"/>

  <!-- Side Rails & Battery V -->
  <line x1="70" y1="60" x2="70" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="270" y1="60" x2="270" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="70" y1="180" x2="160" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="168" x2="160" y2="192" stroke="#10b981" stroke-width="3"/>
  <line x1="166" y1="173" x2="166" y2="187" stroke="#10b981" stroke-width="1.5"/>
  <text x="163" y="158" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">V</text>
  <line x1="166" y1="180" x2="270" y2="180" stroke="#94a3b8" stroke-width="2"/>

  <text x="170" y="210" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">U_P / U_T = (1/2 C (V/2)^2) / (1/2 (3C/2) V^2) = 1/6</text>
</svg>