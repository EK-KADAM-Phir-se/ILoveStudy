<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="200">
  <rect width="300" height="240" fill="#0f172a" rx="16"/>
  <!-- Circular Loop of Radius r -->
  <circle cx="150" cy="120" r="70" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="150" cy="120" r="3" fill="#f59e0b"/>
  <text x="155" y="125" fill="#f59e0b" font-family="sans-serif" font-weight="bold" font-size="12">O</text>
  <line x1="150" y1="120" x2="200" y2="165" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="175" y="140" fill="#64748b" font-family="sans-serif" font-size="11">r</text>

  <!-- Incoming current at A -->
  <line x1="150" y1="20" x2="150" y2="50" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="150,50 145,40 155,40" fill="#10b981"/>
  <text x="158" y="35" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="12">I_0 (at A)</text>
  <text x="150" y="65" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle">A</text>

  <!-- Left Path B (R_1 = R/2, I_1 = 2/3 I_0) -->
  <text x="60" y="125" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12">B</text>

  <!-- Right Path D (R_2 = R, I_2 = 1/3 I_0) -->
  <text x="230" y="125" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12">D</text>

  <!-- Outgoing current at C -->
  <text x="150" y="185" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle">C</text>
  <line x1="150" y1="190" x2="150" y2="220" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="150,220 145,210 155,210" fill="#10b981"/>
  <text x="158" y="215" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="12">I_0 (at C)</text>

  <text x="150" y="235" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">B_net = (μ_0 / 4r)(2/3 I_0 - 1/3 I_0) = μ_0 I_0 / 12r</text>
</svg>