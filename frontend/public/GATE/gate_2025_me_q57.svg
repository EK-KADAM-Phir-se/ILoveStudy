<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, sans-serif;">
  <!-- Simply Supported Beam -->
  <line x1="100" y1="140" x2="400" y2="140" stroke="#cbd5e1" stroke-width="6"/>

  <!-- Supports A and B -->
  <!-- Hinge at A -->
  <polygon points="100,140 85,165 115,165" fill="#64748b"/>
  <line x1="75" y1="165" x2="125" y2="165" stroke="#64748b" stroke-width="2"/>
  <text x="85" y="185" fill="#e2e8f0" font-size="16" font-weight="bold">A</text>

  <!-- Roller at B -->
  <polygon points="400,140 385,165 415,165" fill="#64748b"/>
  <circle cx="390" cy="170" r="4" fill="#64748b"/>
  <circle cx="410" cy="170" r="4" fill="#64748b"/>
  <line x1="375" y1="175" x2="425" y2="175" stroke="#64748b" stroke-width="2"/>
  <text x="415" y="185" fill="#e2e8f0" font-size="16" font-weight="bold">B</text>

  <!-- Uniformly Distributed Moment 1 N m per m -->
  <!-- Curved moment arrows along beam -->
  <g stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M 130 130 A 15 15 0 1 1 150 140"/>
    <polygon points="152,143 145,135 155,133" fill="#38bdf8"/>

    <path d="M 180 130 A 15 15 0 1 1 200 140"/>
    <polygon points="202,143 195,135 205,133" fill="#38bdf8"/>

    <path d="M 230 130 A 15 15 0 1 1 250 140"/>
    <polygon points="252,143 245,135 255,133" fill="#38bdf8"/>

    <path d="M 280 130 A 15 15 0 1 1 300 140"/>
    <polygon points="302,143 295,135 305,133" fill="#38bdf8"/>

    <path d="M 330 130 A 15 15 0 1 1 350 140"/>
    <polygon points="352,143 345,135 355,133" fill="#38bdf8"/>
  </g>
  <text x="250" y="85" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle">1 N m per m</text>

  <!-- Beam Length 1 m -->
  <line x1="100" y1="205" x2="400" y2="205" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="100,205 108,200 108,210" fill="#fbbf24"/>
  <polygon points="400,205 392,200 392,210" fill="#fbbf24"/>
  <text x="250" y="225" fill="#fbbf24" font-size="15" font-weight="bold" text-anchor="middle">1 m</text>
</svg>
