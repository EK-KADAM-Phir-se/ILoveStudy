  <text x="280" y="245" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">A</text>

  <!-- Radius r -->
  <line x1="280" y1="140" x2="336" y2="84" stroke="#fbbf24" stroke-width="2"/>
  <text x="300" y="105" fill="#fbbf24" font-size="15" font-weight="bold">r</text>

  <!-- Angular velocity w arc -->
  <path d="M 230 110 A 60 60 0 0 1 290 80" fill="none" stroke="#22c55e" stroke-width="3.5"/>
  <polygon points="295,78 285,73 287,85" fill="#22c55e"/>
  <text x="220" y="95" fill="#22c55e" font-size="16" font-weight="bold">ω</text>
