<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 320" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, sans-serif;">
  <text x="275" y="30" fill="#e2e8f0" font-size="14" font-weight="bold" text-anchor="middle">Two Identical Tanks</text>

  <!-- Tank 1 (Water) -->
  <rect x="100" y="70" width="120" height="150" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="102" y="110" width="116" height="110" fill="#0284c7" fill-opacity="0.3"/>
  <line x1="102" y1="110" x2="218" y2="110" stroke="#38bdf8" stroke-width="2"/>
  <text x="160" y="60" fill="#94a3b8" font-size="12" text-anchor="middle">atmosphere</text>
  <polygon points="160,65 156,70 164,70" fill="#94a3b8"/>
  <text x="160" y="140" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">water</text>
  <!-- Hole Tank 1 -->
  <rect x="150" y="220" width="20" height="15" fill="#0f172a" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Velocity arrow V1 -->
  <line x1="160" y1="235" x2="160" y2="270" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3,3"/>
  <polygon points="160,275 155,265 165,265" fill="#38bdf8"/>
  <text x="160" y="295" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">V₁</text>

  <!-- Height arrow h -->
  <line x1="80" y1="110" x2="80" y2="220" stroke="#fbbf24" stroke-width="1.5"/>
  <polygon points="80,110 76,118 84,118" fill="#fbbf24"/>
  <polygon points="80,220 76,212 84,212" fill="#fbbf24"/>
  <text x="70" y="170" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">h</text>

  <!-- Diameter arrow d -->
  <line x1="150" y1="240" x2="170" y2="240" stroke="#e2e8f0" stroke-width="1"/>
  <text x="160" y="253" fill="#e2e8f0" font-size="11" text-anchor="middle">d</text>

  <!-- Tank 2 (Engine Oil) -->
  <rect x="330" y="70" width="120" height="150" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="332" y="110" width="116" height="110" fill="#d97706" fill-opacity="0.3"/>
  <line x1="332" y1="110" x2="448" y2="110" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="60" fill="#94a3b8" font-size="12" text-anchor="middle">atmosphere</text>
  <polygon points="390,65 386,70 394,70" fill="#94a3b8"/>
  <text x="390" y="140" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">engine oil</text>
  <!-- Hole Tank 2 -->
  <rect x="380" y="220" width="20" height="15" fill="#0f172a" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Velocity arrow V2 -->
  <line x1="390" y1="235" x2="390" y2="270" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3,3"/>
  <polygon points="390,275 385,265 395,265" fill="#f59e0b"/>
  <text x="390" y="295" fill="#f59e0b" font-size="14" font-weight="bold" text-anchor="middle">V₂</text>

  <!-- Height arrow h -->
  <line x1="310" y1="110" x2="310" y2="220" stroke="#fbbf24" stroke-width="1.5"/>
  <polygon points="310,110 306,118 314,118" fill="#fbbf24"/>
  <polygon points="310,220 306,212 314,212" fill="#fbbf24"/>
  <text x="300" y="170" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">h</text>

  <!-- Gravity Arrow -->
  <line x1="260" y1="130" x2="260" y2="180" stroke="#f43f5e" stroke-width="2"/>
  <polygon points="260,185 256,175 264,175" fill="#f43f5e"/>
  <text x="260" y="120" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="middle">gravity</text>
</svg>
