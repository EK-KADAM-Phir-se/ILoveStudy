<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, sans-serif;">
  <!-- Grid background -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="600" height="320" fill="url(#grid)" />

  <!-- Main Original Figure Box -->
  <rect x="230" y="20" width="140" height="140" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <line x1="210" y1="20" x2="390" y2="20" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="300" y="14" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="middle">Horizontal Reflection Line</text>

  <!-- Symbols inside original -->
  <!-- Lightning bolt top-left -->
  <path d="M 255 35 L 270 35 L 260 55 L 275 55 L 250 85 L 258 63 L 245 63 Z" fill="#fbbf24"/>
  <!-- L-shape bottom-left with arrow -->
  <path d="M 265 100 L 265 140 L 290 140 L 290 130 L 275 130 L 275 100 Z" fill="#38bdf8"/>
  <polygon points="265,95 260,105 270,105" fill="#38bdf8"/>
  <!-- Corner bracket top-right -->
  <path d="M 330 35 L 360 35 L 360 65 L 350 65 L 350 45 L 330 45 Z" fill="#a855f7"/>
  <!-- Crescent moon bottom-right -->
  <path d="M 350 95 A 25 25 0 0 1 350 140 A 18 18 0 0 0 350 95 Z" fill="#ec4899"/>

  <!-- Question Label -->
  <text x="300" y="180" fill="#94a3b8" font-size="12" text-anchor="middle">Original Figure (Reflected horizontally, then rotated 90° clockwise)</text>

  <!-- Resultant Figure (Option B) -->
  <rect x="230" y="200" width="140" height="100" fill="#0f172a" stroke="#22c55e" stroke-width="2" rx="8"/>
  <text x="300" y="215" fill="#22c55e" font-size="11" font-weight="bold" text-anchor="middle">Resultant Figure (Option B)</text>
  
  <!-- Rotated elements inside Option B -->
  <!-- Lightning bolt top-left -->
  <path d="M 245 230 L 275 240 L 260 245 L 285 258 L 255 258 Z" fill="#fbbf24"/>
  <!-- L shape top-right -->
  <path d="M 320 230 L 350 230 L 350 240 L 330 240 L 330 255 L 320 255 Z" fill="#38bdf8"/>
  <!-- Bracket bottom-left -->
  <path d="M 245 270 L 270 270 L 270 290 L 262 290 L 262 278 L 245 278 Z" fill="#a855f7"/>
  <!-- Crescent bottom-right -->
  <path d="M 320 280 A 25 25 0 0 1 360 280 A 20 20 0 0 0 320 280 Z" fill="#ec4899"/>
</svg>
