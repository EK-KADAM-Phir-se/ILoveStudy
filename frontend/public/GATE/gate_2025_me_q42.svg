<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, sans-serif;">
  <!-- Ceiling Support -->
  <line x1="220" y1="30" x2="300" y2="30" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 225 30 L 215 20 M 245 30 L 235 20 M 265 30 L 255 20 M 285 30 L 275 20 M 300 30 L 290 20" stroke="#64748b" stroke-width="2"/>

  <!-- Spring K -->
  <path d="M 260 30 L 260 50 L 270 57 L 250 71 L 270 85 L 250 99 L 270 113 L 250 127 L 260 134 L 260 150" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <text x="235" y="95" fill="#fbbf24" font-size="16" font-weight="bold">K</text>

  <!-- Wall Support for Cantilever O -->
  <line x1="120" y1="120" x2="120" y2="180" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 120 125 L 110 115 M 120 145 L 110 135 M 120 165 L 110 155 M 120 180 L 110 170" stroke="#64748b" stroke-width="2"/>
  <text x="100" y="155" fill="#e2e8f0" font-size="16" font-weight="bold">O</text>

  <!-- Cantilever Beam EI -->
  <rect x="120" y="144" x2="260" y2="156" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" rx="2"/>
  <line x1="120" y1="150" x2="260" y2="150" stroke="#0f172a" stroke-width="3"/>

  <!-- Length L -->
  <line x1="120" y1="175" x2="260" y2="175" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="120,175 128,171 128,179" fill="#38bdf8"/>
  <polygon points="260,175 252,171 252,179" fill="#38bdf8"/>
  <text x="190" y="195" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle">L</text>

  <!-- Mass m block -->
  <rect x="235" y="175" width="50" height="35" fill="#0284c7" stroke="#38bdf8" stroke-width="2" rx="4"/>
  <text x="260" y="198" fill="#e2e8f0" font-size="16" font-weight="bold" text-anchor="middle">m</text>
  <line x1="260" y1="156" x2="260" y2="175" stroke="#e2e8f0" stroke-width="2"/>
</svg>
