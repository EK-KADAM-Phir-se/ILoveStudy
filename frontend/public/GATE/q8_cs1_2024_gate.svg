<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" fill="#ffffff"/>
  <text x="250" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Macronutrient Energy Contribution</text>
  <!-- Pie Chart Slices -->
  <!-- Center: (250, 170), Radius: 120 -->
  <!-- Carbohydrates 35% (126 deg) -->
  <path d="M 250 170 L 250 50 A 120 120 0 0 1 347 240 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <!-- Proteins 20% (72 deg) -->
  <path d="M 250 170 L 347 240 A 120 120 0 0 1 213 284 Z" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <!-- Unsaturated fat 20% (72 deg) -->
  <path d="M 250 170 L 213 284 A 120 120 0 0 1 136 207 Z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <!-- Saturated fat 20% (72 deg) -->
  <path d="M 250 170 L 136 207 A 120 120 0 0 1 180 72 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <!-- Trans fat 5% (18 deg) -->
  <path d="M 250 170 L 180 72 A 120 120 0 0 1 250 50 Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>

  <!-- Labels -->
  <text x="310" y="130" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1">Carbohydrates 35%</text>
  <text x="270" y="240" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c2410c">Proteins 20%</text>
  <text x="140" y="240" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">Unsaturated fat 20%</text>
  <text x="140" y="140" font-family="sans-serif" font-size="11" font-weight="bold" fill="#854d0e">Saturated fat 20%</text>
  <text x="205" y="85" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e40af">Trans fat 5%</text>
</svg>