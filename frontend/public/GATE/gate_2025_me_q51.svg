<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, sans-serif;">
  <!-- Heat Flux Arrows (Top & Bottom) -->
  <g stroke="#f59e0b" stroke-width="2">
    <line x1="180" y1="30" x2="180" y2="65"/><polygon points="180,70 175,60 185,60" fill="#f59e0b"/>
    <line x1="240" y1="30" x2="240" y2="65"/><polygon points="240,70 235,60 245,60" fill="#f59e0b"/>
    <line x1="300" y1="30" x2="300" y2="65"/><polygon points="300,70 295,60 305,60" fill="#f59e0b"/>
    <line x1="360" y1="30" x2="360" y2="65"/><polygon points="360,70 355,60 365,60" fill="#f59e0b"/>
  </g>
  <text x="270" y="25" fill="#f59e0b" font-size="14" font-weight="bold" text-anchor="middle">2000 W m⁻²</text>

  <!-- Tube -->
  <rect x="150" y="70" width="240" height="70" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="3" rx="6"/>
  <ellipse cx="150" cy="105" rx="10" ry="35" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="2"/>
  <ellipse cx="390" cy="105" rx="10" ry="35" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>

  <!-- Water Inlet -->
  <line x1="90" y1="105" x2="140" y2="105" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="145,105 135,100 135,110" fill="#38bdf8"/>
  <text x="115" y="90" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Water</text>
  <text x="115" y="125" fill="#38bdf8" font-size="12" text-anchor="middle">0.01 kg s⁻¹</text>
  <text x="115" y="145" fill="#38bdf8" font-size="12" text-anchor="middle">293 K</text>

  <!-- Water Outlet -->
  <line x1="395" y1="105" x2="445" y2="105" stroke="#ef4444" stroke-width="3"/>
  <polygon points="450,105 440,100 440,110" fill="#ef4444"/>
  <text x="420" y="125" fill="#ef4444" font-size="13" font-weight="bold">353 K</text>

  <!-- Dimensions D and L -->
  <line x1="270" y1="70" x2="270" y2="140" stroke="#a855f7" stroke-width="1.5"/>
  <text x="280" y="110" fill="#a855f7" font-size="13" font-weight="bold">D = 60 mm</text>

  <line x1="150" y1="170" x2="390" y2="170" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="150,170 158,166 158,174" fill="#fbbf24"/>
  <polygon points="390,170 382,166 382,174" fill="#fbbf24"/>
  <text x="270" y="195" fill="#fbbf24" font-size="15" font-weight="bold" text-anchor="middle">L</text>
</svg>
