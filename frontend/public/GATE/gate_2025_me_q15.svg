<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, sans-serif;">
  <!-- Air Box -->
  <rect x="50" y="20" width="400" height="260" fill="#1e293b" stroke="#334155" stroke-width="2" rx="12"/>
  <text x="250" y="45" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Air 30°C</text>
  <text x="250" y="265" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Air 30°C</text>

  <!-- Spherical Ice Block -->
  <circle cx="250" cy="150" r="60" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,2"/>
  <circle cx="250" cy="150" r="58" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="250" y="145" fill="#ef4444" font-size="15" font-weight="extrabold" text-anchor="middle">-7°C</text>
  <text x="250" y="165" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Ice Block</text>

  <!-- Gravity Arrow -->
  <line x1="370" y1="110" x2="370" y2="180" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <polygon points="370,190 363,175 377,175" fill="#f43f5e"/>
  <text x="370" y="100" fill="#f43f5e" font-size="13" font-weight="bold" text-anchor="middle">Gravity</text>

  <!-- Direction Indicator Cross -->
  <line x1="120" y1="150" x2="160" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="140" y1="130" x2="140" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="122" fill="#e2e8f0" font-size="11" text-anchor="middle">Upward</text>
  <text x="140" y="185" fill="#e2e8f0" font-size="11" text-anchor="middle">Downward</text>
  <text x="95" y="154" fill="#e2e8f0" font-size="11" text-anchor="end">Sideward</text>
</svg>
