<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, sans-serif;">
  <!-- Concentric Circles -->
  <!-- Outer circle r=5mm -->
  <circle cx="200" cy="150" r="100" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2"/>
  <!-- Inner circle r=3mm -->
  <circle cx="200" cy="150" r="60" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>

  <!-- Dimension arrows -->
  <!-- Inner r=3mm -->
  <line x1="200" y1="150" x2="260" y2="150" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="260,150 252,145 252,155" fill="#38bdf8"/>
  <text x="225" y="142" fill="#38bdf8" font-size="13" font-weight="bold">3 mm</text>

  <!-- Outer r=5mm -->
  <line x1="200" y1="150" x2="200" y2="250" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="200,250 195,242 205,242" fill="#f59e0b"/>
  <text x="208" y="210" fill="#f59e0b" font-size="13" font-weight="bold">5 mm</text>

  <!-- Shaded Area Label -->
  <text x="200" y="45" fill="#e2e8f0" font-size="14" font-weight="bold" text-anchor="middle">Heated Area (Power Incident: 2500 W)</text>
  <text x="200" y="290" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">Shaded Ring: 85% - 65% = 20% absorbed</text>
</svg>
