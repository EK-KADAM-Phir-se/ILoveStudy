<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 320" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, sans-serif;">
  <!-- Stress Block Element -->
  <rect x="150" y="100" width="150" height="120" fill="#1e293b" stroke="#cbd5e1" stroke-width="3" rx="4"/>

  <!-- Tensile Stress sigma_x = 350 MPa -->
  <line x1="300" y1="160" x2="380" y2="160" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="385,160 372,154 372,166" fill="#38bdf8"/>
  <line x1="150" y1="160" x2="70" y2="160" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="65,160 78,154 78,166" fill="#38bdf8"/>
  <text x="390" y="165" fill="#38bdf8" font-size="14" font-weight="bold">350 GPa</text>

  <!-- Tensile/Comp Stress sigma_y = 150 GPa -->
  <line x1="225" y1="100" x2="225" y2="30" stroke="#ef4444" stroke-width="3"/>
  <polygon points="225,25 219,38 231,38" fill="#ef4444"/>
  <line x1="225" y1="220" x2="225" y2="290" stroke="#ef4444" stroke-width="3"/>
  <polygon points="225,295 219,282 231,282" fill="#ef4444"/>
  <text x="225" y="20" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="middle">150 GPa</text>

  <!-- Shear Stress tau = 50 GPa -->
  <line x1="70" y1="200" x2="140" y2="200" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="145,200 135,195 135,205" fill="#f59e0b"/>
  <text x="50" y="205" fill="#f59e0b" font-size="13" font-weight="bold">50 GPa</text>

  <!-- Axes -->
  <line x1="80" y1="240" x2="120" y2="240" stroke="#a855f7" stroke-width="2"/>
  <polygon points="125,240 115,236 115,244" fill="#a855f7"/>
  <text x="130" y="245" fill="#a855f7" font-size="13" font-weight="bold">X</text>

  <line x1="80" y1="240" x2="80" y2="200" stroke="#a855f7" stroke-width="2"/>
  <polygon points="80,195 76,205 84,205" fill="#a855f7"/>
  <text x="80" y="190" fill="#a855f7" font-size="13" font-weight="bold" text-anchor="middle">Y</text>

  <line x1="80" y1="240" x2="55" y2="265" stroke="#a855f7" stroke-width="2"/>
  <text x="48" y="275" fill="#a855f7" font-size="13" font-weight="bold">Z</text>
</svg>
