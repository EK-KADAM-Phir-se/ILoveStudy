<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" width="100%" height="100%">
  <rect width="450" height="200" fill="#ffffff"/>
  <!-- Line of symmetry AB -->
  <line x1="50" y1="100" x2="400" y2="100" stroke="#0f172a" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="70" y="90" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">A</text>
  <text x="380" y="90" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">B</text>

  <!-- Squares above/below line -->
  <rect x="180" y="60" width="40" height="40" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <rect x="220" y="100" width="40" height="40" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <rect x="260" y="100" width="40" height="40" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <rect x="300" y="100" width="40" height="40" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
</svg>