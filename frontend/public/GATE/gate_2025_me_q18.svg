  <rect x="120" y="40" width="210" height="220" fill="#334155" stroke="#64748b" stroke-width="8" rx="8"/>
  <rect x="135" y="55" width="180" height="190" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="225" y="160" fill="#e2e8f0" font-size="18" font-weight="extrabold" text-anchor="middle">Air</text>
