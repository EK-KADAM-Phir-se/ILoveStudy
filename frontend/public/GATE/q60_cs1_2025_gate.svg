<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="100%">
  <rect width="650" height="250" fill="#ffffff"/>

  <!-- D Flip Flops 0 to 3 -->
  <g transform="translate(60, 60)">
    <!-- FF0 -->
    <rect x="0" y="0" width="70" height="90" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="50" y="25" font-family="sans-serif" font-size="14" font-weight="bold">Q₀</text>
    <text x="12" y="45" font-family="sans-serif" font-size="13">D0</text>
    <text x="50" y="70" font-family="sans-serif" font-size="14" font-weight="bold">Q̄₀</text>

    <!-- FF1 -->
    <rect x="130" y="0" width="70" height="90" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="180" y="25" font-family="sans-serif" font-size="14" font-weight="bold">Q₁</text>
    <text x="142" y="45" font-family="sans-serif" font-size="13">D1</text>
    <text x="180" y="70" font-family="sans-serif" font-size="14" font-weight="bold">Q̄₁</text>

    <!-- FF2 -->
    <rect x="260" y="0" width="70" height="90" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="310" y="25" font-family="sans-serif" font-size="14" font-weight="bold">Q₂</text>
    <text x="272" y="45" font-family="sans-serif" font-size="13">D2</text>
    <text x="310" y="70" font-family="sans-serif" font-size="14" font-weight="bold">Q̄₂</text>

    <!-- FF3 -->
    <rect x="390" y="0" width="70" height="90" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="440" y="25" font-family="sans-serif" font-size="14" font-weight="bold">Q₃</text>
    <text x="402" y="45" font-family="sans-serif" font-size="13">D3</text>
    <text x="440" y="70" font-family="sans-serif" font-size="14" font-weight="bold">Q̄₃</text>

    <!-- Feedback & Lines -->
    <line x1="460" y1="70" x2="490" y2="70" stroke="#0f172a" stroke-width="2"/>
    <line x1="490" y1="70" x2="490" y2="-30" stroke="#0f172a" stroke-width="2"/>
    <line x1="490" y1="-30" x2="-20" y2="-30" stroke="#0f172a" stroke-width="2"/>
    <line x1="-20" y1="-30" x2="-20" y2="45" stroke="#0f172a" stroke-width="2"/>
    <line x1="-20" y1="45" x2="0" y2="45" stroke="#0f172a" stroke-width="2"/>

    <!-- Clock Line -->
    <line x1="-20" y1="120" x2="425" y2="120" stroke="#0f172a" stroke-width="2"/>
    <text x="-50" y="125" font-family="sans-serif" font-size="13" font-weight="bold">CLK</text>
    <line x1="35" y1="90" x2="35" y2="120" stroke="#0f172a" stroke-width="2"/>
    <line x1="165" y1="90" x2="165" y2="120" stroke="#0f172a" stroke-width="2"/>
    <line x1="295" y1="90" x2="295" y2="120" stroke="#0f172a" stroke-width="2"/>
    <line x1="425" y1="90" x2="425" y2="120" stroke="#0f172a" stroke-width="2"/>
  </g>
</svg>