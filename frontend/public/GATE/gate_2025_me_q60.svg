<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, sans-serif;">
  <!-- Ground Line for Offset Slider -->
  <line x1="280" y1="130" x2="420" y2="130" stroke="#94a3b8" stroke-width="3"/>
  <path d="M 290 130 L 280 140 M 310 130 L 300 140 M 330 130 L 320 140 M 350 130 L 340 140 M 370 130 L 360 140 M 390 130 L 380 140 M 410 130 L 400 140" stroke="#64748b" stroke-width="1.5"/>

  <!-- Slider Box -->
  <rect x="300" y="100" width="50" height="30" fill="#0284c7" stroke="#38bdf8" stroke-width="2" rx="4"/>
  <circle cx="325" cy="115" r="4" fill="#e2e8f0"/>

  <!-- Crank Center Pin Ground -->
  <line x1="120" y1="180" x2="120" y2="200" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="120,180 105,200 135,200" fill="#64748b"/>
  <circle cx="120" cy="180" r="5" fill="#e2e8f0"/>

  <!-- Crank Pin (120, 180) to (160, 110) -->
  <line x1="120" y1="180" x2="160" y2="110" stroke="#f59e0b" stroke-width="5"/>
  <circle cx="160" cy="110" r="5" fill="#fbbf24"/>

  <!-- Connecting Rod (160, 110) to (325, 115) -->
  <line x1="160" y1="110" x2="325" y2="115" stroke="#38bdf8" stroke-width="4"/>

  <!-- Rotation Arrow on Crank -->
  <path d="M 110 160 A 25 25 0 0 1 140 160" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <polygon points="143,165 138,155 146,155" fill="#22c55e"/>

  <!-- Dimension Labels -->
  <text x="120" y="140" fill="#fbbf24" font-size="14" font-weight="bold">30 mm</text>
  <text x="230" y="95" fill="#38bdf8" font-size="14" font-weight="bold">50 mm</text>

  <!-- Offset 10 mm dimension -->
  <line x1="380" y1="115" x2="380" y2="180" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="120" y1="180" x2="380" y2="180" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="390" y="150" fill="#ef4444" font-size="13" font-weight="bold">10 mm</text>
</svg>
