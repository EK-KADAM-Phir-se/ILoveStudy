<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 210" width="100%" height="100%">
  <rect width="780" height="210" fill="#ffffff"/>
  
  <!-- ROOT NODE -->
  <g transform="translate(300, 20)">
    <!-- Outer rectangle -->
    <rect x="0" y="0" width="180" height="42" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <!-- Double side bars -->
    <line x1="5" y1="0" x2="5" y2="42" stroke="#0f172a" stroke-width="2"/>
    <line x1="175" y1="0" x2="175" y2="42" stroke="#0f172a" stroke-width="2"/>
    <!-- Cell Dividers -->
    <line x1="60" y1="0" x2="60" y2="42" stroke="#0f172a" stroke-width="2"/>
    <line x1="120" y1="0" x2="120" y2="42" stroke="#0f172a" stroke-width="2"/>
    <!-- Values -->
    <text x="32.5" y="27" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">6</text>
    <text x="90" y="27" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">12</text>
    <text x="147.5" y="27" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">19</text>
  </g>

  <!-- CONNECTING BRANCH LINES -->
  <!-- Left of 6 (x=300) to Leaf 1 (x=105) -->
  <line x1="300" y1="62" x2="105" y2="140" stroke="#0f172a" stroke-width="1.8"/>
  <!-- Between 6 and 12 (x=360) to Leaf 2 (x=295) -->
  <line x1="360" y1="62" x2="295" y2="140" stroke="#0f172a" stroke-width="1.8"/>
  <!-- Between 12 and 19 (x=420) to Leaf 3 (x=485) -->
  <line x1="420" y1="62" x2="485" y2="140" stroke="#0f172a" stroke-width="1.8"/>
  <!-- Right of 19 (x=480) to Leaf 4 (x=675) -->
  <line x1="480" y1="62" x2="675" y2="140" stroke="#0f172a" stroke-width="1.8"/>

  <!-- LEAF NODES -->
  
  <!-- Leaf 1 (x=20) -->
  <g transform="translate(20, 140)">
    <rect x="0" y="0" width="170" height="42" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <line x1="5" y1="0" x2="5" y2="42" stroke="#0f172a" stroke-width="2"/>
    <line x1="165" y1="0" x2="165" y2="42" stroke="#0f172a" stroke-width="2"/>
    <line x1="56.6" y1="0" x2="56.6" y2="42" stroke="#0f172a" stroke-width="2"/>
    <line x1="113.3" y1="0" x2="113.3" y2="42" stroke="#0f172a" stroke-width="2"/>
    <text x="30.8" y="27" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">1</text>
    <text x="85" y="27" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">4</text>
    <text x="139.2" y="27" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">3</text>
  </g>

  <!-- Leaf 2 (x=210) -->
  <g transform="translate(210, 140)">
    <rect x="0" y="0" width="170" height="42" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <line x1="5" y1="0" x2="5" y2="42" stroke="#0f172a" stroke-width="2"/>
    <line x1="165" y1="0" x2="165" y2="42" stroke="#0f172a" stroke-width="2"/>
    <line x1="56.6" y1="0" x2="56.6" y2="42" stroke="#0f172a" stroke-width="2"/>
    <line x1="113.3" y1="0" x2="113.3" y2="42" stroke="#0f172a" stroke-width="2"/>
    <text x="30.8" y="27" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">7</text>
    <text x="85" y="27" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">9</text>
    <text x="139.2" y="27" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">10</text>
  </g>

  <!-- Leaf 3 (x=400) -->
  <g transform="translate(400, 140)">
    <rect x="0" y="0" width="170" height="42" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <line x1="5" y1="0" x2="5" y2="42" stroke="#0f172a" stroke-width="2"/>
    <line x1="165" y1="0" x2="165" y2="42" stroke="#0f172a" stroke-width="2"/>
    <line x1="56.6" y1="0" x2="56.6" y2="42" stroke="#0f172a" stroke-width="2"/>
    <line x1="113.3" y1="0" x2="113.3" y2="42" stroke="#0f172a" stroke-width="2"/>
    <text x="30.8" y="27" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">13</text>
    <text x="85" y="27" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">15</text>
    <text x="139.2" y="27" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">17</text>
  </g>

  <!-- Leaf 4 (x=590) -->
  <g transform="translate(590, 140)">
    <rect x="0" y="0" width="170" height="42" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <line x1="5" y1="0" x2="5" y2="42" stroke="#0f172a" stroke-width="2"/>
    <line x1="165" y1="0" x2="165" y2="42" stroke="#0f172a" stroke-width="2"/>
    <line x1="56.6" y1="0" x2="56.6" y2="42" stroke="#0f172a" stroke-width="2"/>
    <line x1="113.3" y1="0" x2="113.3" y2="42" stroke="#0f172a" stroke-width="2"/>
    <text x="30.8" y="27" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">20</text>
    <text x="85" y="27" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">21</text>
    <text x="139.2" y="27" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">22</text>
  </g>
</svg>