<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <rect width="600" height="350" fill="#ffffff"/>
  
  <!-- Cube Net -->
  <g transform="translate(180, 20)">
    <!-- Top: Dot -->
    <rect x="40" y="0" width="40" height="40" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="60" cy="20" r="6" fill="#000000"/>
    
    <!-- Middle Row: Empty, Open Triangle, Filled Triangle -->
    <rect x="0" y="40" width="40" height="40" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <rect x="40" y="40" width="40" height="40" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <polygon points="60,48 50,68 70,68" fill="none" stroke="#000000" stroke-width="2"/>
    
    <rect x="80" y="40" width="40" height="40" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <polygon points="100,48 90,68 110,68" fill="#000000"/>
    
    <!-- Bottom: Circle -->
    <rect x="40" y="80" width="40" height="40" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="60" cy="100" r="8" fill="none" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- Options A, B, C, D Cubes -->
  <!-- Option A -->
  <g transform="translate(40, 180)">
    <text x="30" y="-10" font-family="sans-serif" font-size="14" font-weight="bold">(A)</text>
    <!-- Top Face -->
    <polygon points="30,10 60,0 90,10 60,20" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="60" cy="10" r="4" fill="#000000"/>
    <!-- Left Face -->
    <polygon points="30,10 60,20 60,60 30,50" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <polygon points="45,28 38,42 52,42" fill="none" stroke="#000000" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="60,20 90,10 90,50 60,60" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Option B -->
  <g transform="translate(180, 180)">
    <text x="30" y="-10" font-family="sans-serif" font-size="14" font-weight="bold">(B)</text>
    <polygon points="30,10 60,0 90,10 60,20" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <polygon points="30,10 60,20 60,60 30,50" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <polygon points="45,28 38,42 52,42" fill="none" stroke="#000000" stroke-width="2"/>
    <polygon points="60,20 90,10 90,50 60,60" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <polygon points="75,25 70,38 80,38" fill="#000000"/>
  </g>

  <!-- Option C -->
  <g transform="translate(320, 180)">
    <text x="30" y="-10" font-family="sans-serif" font-size="14" font-weight="bold">(C)</text>
    <polygon points="30,10 60,0 90,10 60,20" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <polygon points="30,10 60,20 60,60 30,50" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <polygon points="45,28 38,42 52,42" fill="none" stroke="#000000" stroke-width="2"/>
    <polygon points="60,20 90,10 90,50 60,60" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Option D -->
  <g transform="translate(460, 180)">
    <text x="30" y="-10" font-family="sans-serif" font-size="14" font-weight="bold">(D)</text>
    <polygon points="30,10 60,0 90,10 60,20" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <polygon points="60,8 54,16 66,16" fill="#000000"/>
    <polygon points="30,10 60,20 60,60 30,50" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <polygon points="45,28 38,42 52,42" fill="none" stroke="#000000" stroke-width="2"/>
    <polygon points="60,20 90,10 90,50 60,60" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="75" cy="32" r="3" fill="#000000"/>
  </g>
</svg>
