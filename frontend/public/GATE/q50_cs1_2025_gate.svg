<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="100%">
  <rect width="650" height="250" fill="#ffffff"/>
  
  <!-- States -->
  <!-- S0 (Start) -->
  <circle cx="100" cy="120" r="28" stroke="#0f172a" stroke-width="2.5" fill="#ffffff"/>
  <!-- S1 -->
  <circle cx="240" cy="120" r="28" stroke="#0f172a" stroke-width="2.5" fill="#ffffff"/>
  <!-- S2 -->
  <circle cx="380" cy="120" r="28" stroke="#0f172a" stroke-width="2.5" fill="#ffffff"/>
  <!-- S3 (Accepting) -->
  <circle cx="520" cy="120" r="28" stroke="#0f172a" stroke-width="2.5" fill="#ffffff"/>
  <circle cx="520" cy="120" r="22" stroke="#0f172a" stroke-width="2" fill="#ffffff"/>

  <!-- Start Arrow -->
  <line x1="40" y1="120" x2="72" y2="120" stroke="#0f172a" stroke-width="2.5"/>
  <polygon points="72,120 62,114 62,126" fill="#0f172a"/>

  <!-- Self Loops -->
  <path d="M 90,95 C 80,50 120,50 110,95" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="100" y="45" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">a</text>

  <path d="M 230,95 C 220,50 260,50 250,95" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="240" y="45" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">b</text>

  <path d="M 370,95 C 360,50 400,50 390,95" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="380" y="45" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">a</text>

  <!-- Forward Transitions -->
  <line x1="128" y1="120" x2="212" y2="120" stroke="#0f172a" stroke-width="2"/>
  <text x="170" y="112" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">b</text>

  <line x1="268" y1="120" x2="352" y2="120" stroke="#0f172a" stroke-width="2"/>
  <text x="310" y="112" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">a</text>

  <line x1="408" y1="120" x2="492" y2="120" stroke="#0f172a" stroke-width="2"/>
  <text x="450" y="112" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">b</text>

  <!-- Backward Loops -->
  <path d="M 380,148 C 300,210 200,210 100,148" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="240" y="195" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">a</text>

  <path d="M 520,148 C 450,220 310,220 240,148" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="380" y="215" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">b</text>
</svg>