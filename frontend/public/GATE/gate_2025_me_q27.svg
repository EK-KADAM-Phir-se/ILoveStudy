<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, sans-serif;">
  <!-- Nodes: C(120, 240), D(280, 240), A(280, 80), B(200, 160) -->
  <!-- Truss Members -->
  <!-- Line CA -->
  <line x1="120" y1="240" x2="280" y2="80" stroke="#38bdf8" stroke-width="3.5"/>
  <!-- Line CD -->
  <line x1="120" y1="240" x2="280" y2="240" stroke="#38bdf8" stroke-width="3.5"/>
  <!-- Line AD -->
  <line x1="280" y1="80" x2="280" y2="240" stroke="#38bdf8" stroke-width="3.5"/>
  <!-- Line BD -->
  <line x1="200" y1="160" x2="280" y2="240" stroke="#f43f5e" stroke-width="3.5" stroke-dasharray="6,4"/>

  <!-- Node Circles & Labels -->
  <circle cx="120" cy="240" r="5" fill="#e2e8f0"/>
  <text x="105" y="250" fill="#e2e8f0" font-size="14" font-weight="bold">C</text>

  <circle cx="280" cy="240" r="5" fill="#e2e8f0"/>
  <text x="295" y="255" fill="#e2e8f0" font-size="14" font-weight="bold">D</text>

  <circle cx="280" cy="80" r="5" fill="#e2e8f0"/>
  <text x="265" y="75" fill="#e2e8f0" font-size="14" font-weight="bold">A</text>

  <circle cx="200" cy="160" r="5" fill="#f43f5e"/>
  <text x="215" y="155" fill="#f43f5e" font-size="14" font-weight="bold">B</text>

  <!-- Supports -->
  <!-- Hinge at C -->
  <polygon points="120,240 110,255 130,255" fill="#64748b"/>
  <line x1="100" y1="255" x2="140" y2="255" stroke="#64748b" stroke-width="2"/>

  <!-- Roller at D -->
  <polygon points="280,240 270,255 290,255" fill="#64748b"/>
  <circle cx="274" cy="259" r="3" fill="#64748b"/>
  <circle cx="286" cy="259" r="3" fill="#64748b"/>
  <line x1="260" y1="263" x2="300" y2="263" stroke="#64748b" stroke-width="2"/>

  <!-- Dimensions & Angles -->
  <text x="145" y="190" fill="#fbbf24" font-size="13" font-weight="bold">√2 m</text>
  <text x="295" y="160" fill="#fbbf24" font-size="13" font-weight="bold">1 m</text>
  <text x="200" y="260" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">1 m</text>

  <!-- 45 deg angle at C -->
  <path d="M 150 240 A 30 30 0 0 0 141 219" fill="none" stroke="#a855f7" stroke-width="2"/>
  <text x="155" y="230" fill="#a855f7" font-size="12" font-weight="bold">45°</text>

  <!-- 90 deg angle at B -->
  <path d="M 215 145 L 225 155 L 210 170" fill="none" stroke="#a855f7" stroke-width="2"/>
  <text x="225" y="180" fill="#a855f7" font-size="12" font-weight="bold">90°</text>

  <!-- Load Force F = 1000 N -->
  <line x1="280" y1="80" x2="360" y2="80" stroke="#22c55e" stroke-width="3"/>
  <polygon points="370,80 355,74 355,86" fill="#22c55e"/>
  <text x="375" y="85" fill="#22c55e" font-size="14" font-weight="bold">F = 1000 N</text>
</svg>
