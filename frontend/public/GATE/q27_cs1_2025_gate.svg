<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="450" fill="#ffffff"/>
  <!-- RA Box -->
  <rect x="180" y="40" width="90" height="35" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="225" y="63" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RA (32 bit)</text>

  <!-- RB Box -->
  <rect x="330" y="40" width="90" height="35" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="375" y="63" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RB (32 bit)</text>

  <!-- Immediate values -->
  <text x="120" y="55" font-family="sans-serif" font-size="13" text-anchor="middle">immediate value</text>
  <text x="120" y="70" font-family="sans-serif" font-size="12" text-anchor="middle">32 bit</text>

  <text x="480" y="55" font-family="sans-serif" font-size="13" text-anchor="middle">immediate value</text>
  <text x="480" y="70" font-family="sans-serif" font-size="12" text-anchor="middle">32 bit</text>

  <!-- Mux A -->
  <polygon points="170,130 250,130 235,165 185,165" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="210" y="152" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Mux_A</text>

  <!-- Mux B -->
  <polygon points="350,130 430,130 415,165 365,165" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="390" y="152" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Mux_B</text>

  <!-- ALU -->
  <polygon points="190,230 410,230 330,290 270,290" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="300" y="265" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ALU</text>

  <!-- RZ Box -->
  <rect x="250" y="325" width="100" height="40" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="300" y="350" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RZ (32 bit)</text>

  <!-- Connectors -->
  <line x1="225" y1="75" x2="225" y2="130" stroke="#0f172a" stroke-width="2"/>
  <line x1="130" y1="80" x2="190" y2="130" stroke="#0f172a" stroke-width="2"/>
  <line x1="375" y1="75" x2="375" y2="130" stroke="#0f172a" stroke-width="2"/>
  <line x1="470" y1="80" x2="410" y2="130" stroke="#0f172a" stroke-width="2"/>
  <line x1="210" y1="165" x2="250" y2="230" stroke="#0f172a" stroke-width="2"/>
  <line x1="390" y1="165" x2="350" y2="230" stroke="#0f172a" stroke-width="2"/>
  <line x1="300" y1="290" x2="300" y2="325" stroke="#0f172a" stroke-width="2"/>
</svg>