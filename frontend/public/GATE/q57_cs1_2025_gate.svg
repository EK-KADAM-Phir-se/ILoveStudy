<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
  <rect width="600" height="250" fill="#ffffff"/>

  <!-- Source -->
  <rect x="40" y="80" width="100" height="60" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="90" y="115" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Source</text>

  <!-- Router 1 -->
  <rect x="200" y="80" width="130" height="60" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="265" y="105" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Router-1</text>
  <text x="265" y="125" font-family="sans-serif" font-size="12" text-anchor="middle">(MTU=5000 bytes)</text>

  <!-- Router 2 -->
  <rect x="370" y="80" width="130" height="60" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="435" y="105" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Router-2</text>
  <text x="435" y="125" font-family="sans-serif" font-size="12" text-anchor="middle">(MTU=3000 bytes)</text>

  <!-- Destination -->
  <rect x="520" y="80" width="60" height="60" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="550" y="115" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Dest</text>

  <!-- Arrows -->
  <line x1="140" y1="110" x2="200" y2="110" stroke="#0f172a" stroke-width="2"/>
  <line x1="330" y1="110" x2="370" y2="110" stroke="#0f172a" stroke-width="2"/>
  <line x1="500" y1="110" x2="520" y2="110" stroke="#0f172a" stroke-width="2"/>
</svg>