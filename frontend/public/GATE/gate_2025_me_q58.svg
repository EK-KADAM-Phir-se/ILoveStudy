<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, sans-serif;">
  <!-- Axes -->
  <line x1="80" y1="240" x2="80" y2="40" stroke="#e2e8f0" stroke-width="2"/>
  <polygon points="80,35 76,45 84,45" fill="#e2e8f0"/>
  <text x="75" y="30" fill="#e2e8f0" font-size="14" font-weight="bold" text-anchor="end">σ (MPa)</text>

  <line x1="80" y1="240" x2="400" y2="240" stroke="#e2e8f0" stroke-width="2"/>
  <polygon points="405,240 395,236 395,244" fill="#e2e8f0"/>
  <text x="415" y="245" fill="#e2e8f0" font-size="15" font-weight="bold">ε</text>
  <text x="70" y="255" fill="#e2e8f0" font-size="14" font-weight="bold">O</text>

  <!-- Bi-linear Stress Strain Curve -->
  <polyline points="80,240 200,100 270,70" fill="none" stroke="#38bdf8" stroke-width="4"/>

  <!-- Dashed grid lines -->
  <line x1="80" y1="100" x2="200" y2="100" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="70" x2="270" y2="70" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <line x1="200" y1="100" x2="200" y2="240" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="270" y1="70" x2="270" y2="240" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Values -->
  <text x="65" y="105" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="end">100</text>
  <text x="65" y="75" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="end">120</text>

  <text x="200" y="260" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">0.01</text>
  <text x="270" y="260" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">0.015</text>
</svg>
