<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 340" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, sans-serif;">
  <!-- Cylindrical Furnace -->
  <!-- Top Surface (2) -->
  <ellipse cx="225" cy="80" rx="100" ry="30" fill="#f43f5e" fill-opacity="0.3" stroke="#f43f5e" stroke-width="3"/>
  <text x="225" y="50" fill="#f43f5e" font-size="14" font-weight="bold" text-anchor="middle">T₂ = 1500 K</text>
  <text x="225" y="85" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Top (2)</text>

  <!-- Side Curved Surface (3) -->
  <path d="M 125 80 L 125 220 A 100 30 0 0 0 325 220 L 325 80" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <line x1="285" y1="150" x2="330" y2="150" stroke="#38bdf8" stroke-width="2"/>
  <text x="335" y="155" fill="#38bdf8" font-size="13" font-weight="bold">Curved (3)</text>
  <text x="335" y="180" fill="#38bdf8" font-size="13" font-weight="bold">T₃ = 500 K</text>

  <!-- Bottom Surface (1) -->
  <ellipse cx="225" cy="220" rx="100" ry="30" fill="#fbbf24" fill-opacity="0.3" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4,3"/>
  <text x="225" y="225" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Bottom (1)</text>
  <text x="225" y="275" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">T₁ = 800 K</text>

  <text x="225" y="315" fill="#94a3b8" font-size="12" text-anchor="middle">Diameter = 5 m, Length = 5 m, View Factor F₁₂ = 0.2</text>
</svg>
