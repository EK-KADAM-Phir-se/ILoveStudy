<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="100%" height="100%">
  <rect width="450" height="300" fill="#ffffff"/>

  <!-- Nodes A, B, C, D -->
  <circle cx="150" cy="80" r="22" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="150" y="86" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">A</text>

  <circle cx="300" cy="80" r="22" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="300" y="86" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">B</text>

  <circle cx="300" cy="210" r="22" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="300" y="216" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">C</text>

  <circle cx="150" cy="210" r="22" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="150" y="216" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">D</text>

  <!-- Edges -->
  <!-- AB (7) -->
  <line x1="172" y1="80" x2="278" y2="80" stroke="#0f172a" stroke-width="2"/>
  <text x="225" y="70" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">7</text>

  <!-- AC (1) -->
  <line x1="165" y1="95" x2="285" y2="195" stroke="#0f172a" stroke-width="2"/>
  <text x="220" y="130" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">1</text>

  <!-- AD (6) -->
  <line x1="150" y1="102" x2="150" y2="188" stroke="#0f172a" stroke-width="2"/>
  <text x="135" y="150" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">6</text>

  <!-- BC (x) -->
  <line x1="300" y1="102" x2="300" y2="188" stroke="#0f172a" stroke-width="2"/>
  <text x="315" y="150" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">x</text>

  <!-- BD (3) -->
  <line x1="285" y1="95" x2="165" y2="195" stroke="#0f172a" stroke-width="2"/>
  <text x="220" y="175" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">3</text>

  <!-- CD (8) -->
  <line x1="172" y1="210" x2="278" y2="210" stroke="#0f172a" stroke-width="2"/>
  <text x="225" y="230" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">8</text>
</svg>