<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, sans-serif;">
  <text x="300" y="25" fill="#e2e8f0" font-size="14" font-weight="bold" text-anchor="middle">Mohr's Circle Options for Uniform Hydrostatic Pressure P</text>

  <!-- Option A -->
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="240" height="110" fill="#1e293b" stroke="#334155" rx="6"/>
    <text x="15" y="22" fill="#e2e8f0" font-size="12" font-weight="bold">(A)</text>
    <line x1="20" y1="65" x2="220" y2="65" stroke="#64748b" stroke-width="1.5"/>
    <line x1="120" y1="15" x2="120" y2="100" stroke="#64748b" stroke-width="1.5"/>
    <text x="215" y="60" fill="#94a3b8" font-size="10">σ</text>
    <text x="125" y="25" fill="#94a3b8" font-size="10">τ</text>
    <circle cx="170" cy="65" r="5" fill="#38bdf8"/>
    <text x="170" y="82" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">P</text>
  </g>

  <!-- Option B (CORRECT) -->
  <g transform="translate(320, 50)">
    <rect x="0" y="0" width="240" height="110" fill="#1e293b" stroke="#22c55e" stroke-width="2" rx="6"/>
    <text x="15" y="22" fill="#22c55e" font-size="12" font-weight="bold">(B) ✓ Correct</text>
    <line x1="20" y1="65" x2="220" y2="65" stroke="#64748b" stroke-width="1.5"/>
    <line x1="120" y1="15" x2="120" y2="100" stroke="#64748b" stroke-width="1.5"/>
    <text x="215" y="60" fill="#94a3b8" font-size="10">σ</text>
    <text x="125" y="25" fill="#94a3b8" font-size="10">τ</text>
    <circle cx="70" cy="65" r="5" fill="#ef4444"/>
    <text x="70" y="82" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">-P</text>
  </g>

  <!-- Option C -->
  <g transform="translate(40, 180)">
    <rect x="0" y="0" width="240" height="110" fill="#1e293b" stroke="#334155" rx="6"/>
    <text x="15" y="22" fill="#e2e8f0" font-size="12" font-weight="bold">(C)</text>
    <line x1="20" y1="65" x2="220" y2="65" stroke="#64748b" stroke-width="1.5"/>
    <line x1="120" y1="15" x2="120" y2="100" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="120" cy="65" r="35" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="160" y="82" fill="#fbbf24" font-size="11" font-weight="bold">P</text>
    <text x="75" y="82" fill="#fbbf24" font-size="11" font-weight="bold">-P</text>
  </g>

  <!-- Option D -->
  <g transform="translate(320, 180)">
    <rect x="0" y="0" width="240" height="110" fill="#1e293b" stroke="#334155" rx="6"/>
    <text x="15" y="22" fill="#e2e8f0" font-size="12" font-weight="bold">(D)</text>
    <line x1="20" y1="65" x2="220" y2="65" stroke="#64748b" stroke-width="1.5"/>
    <line x1="120" y1="15" x2="120" y2="100" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="70" cy="65" r="50" fill="none" stroke="#a855f7" stroke-width="2"/>
    <text x="65" y="82" fill="#a855f7" font-size="11" font-weight="bold">-P</text>
  </g>
</svg>
