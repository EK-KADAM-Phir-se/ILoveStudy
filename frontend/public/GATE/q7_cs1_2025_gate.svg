<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" fill="#ffffff"/>
  <!-- Triangle PQR -->
  <polygon points="250,50 100,280 400,280" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Parallel line ST -->
  <line x1="175" y1="165" x2="325" y2="165" stroke="#0f172a" stroke-width="2.5"/>
  
  <!-- Labels -->
  <text x="250" y="40" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">P</text>
  <text x="160" y="165" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="end">S</text>
  <text x="340" y="165" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="start">T</text>
  <text x="85" y="290" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="end">Q</text>
  <text x="415" y="290" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="start">R</text>
</svg>