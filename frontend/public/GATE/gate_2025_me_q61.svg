<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, sans-serif;">
  <!-- Top Plate -->
  <rect x="100" y="70" width="220" height="30" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
  <text x="210" y="90" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">10 mm</text>

  <!-- Bottom Plate -->
  <rect x="200" y="100" width="220" height="30" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
  <text x="310" y="120" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">10 mm</text>

  <!-- Transverse Fillet Weld -->
  <polygon points="320,100 320,70 340,100" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>

  <!-- Tensile Load 5 kN Left -->
  <line x1="100" y1="85" x2="40" y2="85" stroke="#ef4444" stroke-width="3"/>
  <polygon points="30,85 45,79 45,91" fill="#ef4444"/>
  <text x="50" y="70" fill="#ef4444" font-size="14" font-weight="bold">5 kN</text>

  <!-- Tensile Load 5 kN Right -->
  <line x1="420" y1="115" x2="480" y2="115" stroke="#ef4444" stroke-width="3"/>
  <polygon points="490,115 475,109 475,121" fill="#ef4444"/>
  <text x="440" y="138" fill="#ef4444" font-size="14" font-weight="bold">5 kN</text>

  <!-- Thickness Arrows -->
  <line x1="150" y1="70" x2="150" y2="100" stroke="#fbbf24" stroke-width="1.5"/>
  <polygon points="150,70 146,78 154,78" fill="#fbbf24"/>
  <polygon points="150,100 146,92 154,92" fill="#fbbf24"/>

  <line x1="370" y1="100" x2="370" y2="130" stroke="#fbbf24" stroke-width="1.5"/>
  <polygon points="370,100 366,108 374,108" fill="#fbbf24"/>
  <polygon points="370,130 366,122 374,122" fill="#fbbf24"/>
</svg>
