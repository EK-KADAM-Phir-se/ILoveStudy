<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, sans-serif;">
  <!-- Duct / Wind Tunnel -->
  <line x1="80" y1="80" x2="350" y2="80" stroke="#64748b" stroke-width="3"/>
  <line x1="80" y1="220" x2="350" y2="220" stroke="#64748b" stroke-width="3"/>

  <!-- Air Flow Arrow -->
  <line x1="100" y1="150" x2="160" y2="150" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="170,150 155,143 155,157" fill="#38bdf8"/>
  <text x="135" y="135" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Air</text>

  <!-- Pitot Tube Structure -->
  <path d="M 180 150 L 270 150 L 270 240 M 230 220 L 230 180 L 250 180 L 250 240" fill="none" stroke="#e2e8f0" stroke-width="4"/>

  <!-- Mercury U-Tube Manometer -->
  <path d="M 230 240 L 230 260 A 20 20 0 0 0 270 260 L 270 240" fill="none" stroke="#e2e8f0" stroke-width="12"/>
  <path d="M 230 230 L 230 260 A 20 20 0 0 0 270 260 L 270 200" fill="none" stroke="#94a3b8" stroke-width="8"/>
  <text x="250" y="285" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">Mercury</text>
  <text x="310" y="160" fill="#e2e8f0" font-size="12" font-weight="bold">Pitot tube</text>

  <!-- Manometer Height Difference h = 30 mm -->
  <line x1="210" y1="230" x2="290" y2="230" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="210" y1="200" x2="290" y2="200" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="215" y1="200" x2="215" y2="230" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="215,200 211,208 219,208" fill="#fbbf24"/>
  <polygon points="215,230 211,222 219,222" fill="#fbbf24"/>
  <text x="200" y="218" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="end">h</text>
</svg>
