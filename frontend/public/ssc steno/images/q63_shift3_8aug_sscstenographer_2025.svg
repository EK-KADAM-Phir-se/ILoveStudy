<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <rect width="100%" height="100%" fill="#ffffff" rx="6"/>
  
  <g stroke="#1e293b" stroke-width="2" fill="none" transform="translate(90,90)">
    <!-- Hexagon -->
    <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5"/>
    <!-- Upward Equilateral Triangle -->
    <polygon points="0,-75 65,37.5 -65,37.5" stroke="#2563eb"/>
    <!-- Downward Equilateral Triangle -->
    <polygon points="0,75 65,-37.5 -65,-37.5" stroke="#2563eb"/>
  </g>

</svg>