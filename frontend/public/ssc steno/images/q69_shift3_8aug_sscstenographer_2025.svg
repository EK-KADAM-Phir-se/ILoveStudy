<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 90" width="240" height="90">
  <rect width="100%" height="100%" fill="#ffffff" rx="6"/>
  
  <g stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">
    <!-- Die 1: top 6, front 2, right 4 -->
    <g transform="translate(10, 5)">
      <polygon points="35,10 60,22 35,34 10,22"/>
      <text x="35" y="25" text-anchor="middle" fill="#1e293b">6</text>
      <polygon points="10,22 35,34 35,62 10,50"/>
      <text x="22.5" y="47" text-anchor="middle" fill="#1e293b">2</text>
      <polygon points="35,34 60,22 60,50 35,62"/>
      <text x="47.5" y="47" text-anchor="middle" fill="#1e293b">4</text>
    </g>
    <!-- Die 2: top 3, front 5, right 1 -->
    <g transform="translate(85, 5)">
      <polygon points="35,10 60,22 35,34 10,22"/>
      <text x="35" y="25" text-anchor="middle" fill="#1e293b">3</text>
      <polygon points="10,22 35,34 35,62 10,50"/>
      <text x="22.5" y="47" text-anchor="middle" fill="#1e293b">5</text>
      <polygon points="35,34 60,22 60,50 35,62"/>
      <text x="47.5" y="47" text-anchor="middle" fill="#1e293b">1</text>
    </g>
    <!-- Die 3: top 2, front 3, right 6 -->
    <g transform="translate(160, 5)">
      <polygon points="35,10 60,22 35,34 10,22"/>
      <text x="35" y="25" text-anchor="middle" fill="#1e293b">2</text>
      <polygon points="10,22 35,34 35,62 10,50"/>
      <text x="22.5" y="47" text-anchor="middle" fill="#1e293b">3</text>
      <polygon points="35,34 60,22 60,50 35,62"/>
      <text x="47.5" y="47" text-anchor="middle" fill="#1e293b">6</text>
    </g>
  </g>

</svg>