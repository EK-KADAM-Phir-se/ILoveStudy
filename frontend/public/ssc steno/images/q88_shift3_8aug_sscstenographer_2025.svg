<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70">
  <rect width="100%" height="100%" fill="#ffffff" rx="6"/>
  
  <g stroke="#1e293b" stroke-width="1.5" fill="none" font-family="sans-serif" font-size="16" font-weight="bold" fill="#475569">
    <!-- Fig 1: Square with circle -->
    <rect x="15" y="10" width="50" height="50"/>
    <circle cx="40" cy="35" r="18"/>
    <!-- Colon -->
    <text x="77" y="38">:</text>
    <!-- Fig 2: Circle with square -->
    <circle cx="115" cy="35" r="25"/>
    <rect x="97" y="17" width="36" height="36"/>
    <!-- Double Colon -->
    <text x="152" y="38">::</text>
    <!-- Fig 3: Triangle with ellipse -->
    <polygon points="205,10 180,60 230,60"/>
    <ellipse cx="205" cy="42" rx="14" ry="9"/>
    <!-- Colon -->
    <text x="242" y="38">:</text>
    <text x="260" y="42" font-size="22" fill="#6366f1">?</text>
  </g>

</svg>