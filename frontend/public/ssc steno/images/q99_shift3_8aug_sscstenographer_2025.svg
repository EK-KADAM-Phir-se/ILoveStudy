<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" width="260" height="160">
  <rect width="100%" height="100%" fill="#ffffff" rx="6"/>
  
  <g font-family="sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">
    <!-- Shyam -->
    <rect x="90" y="10" width="80" height="26" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="130" y="27" font-weight="bold" fill="#0369a1">Shyam</text>
    <line x1="130" y1="36" x2="130" y2="65" stroke="#64748b" stroke-width="1.5"/>
    <!-- Karan & Pooja -->
    <rect x="145" y="65" width="75" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="182.5" y="82" font-weight="bold" fill="#1d4ed8">Karan</text>
    <line x1="115" y1="78" x2="145" y2="78" stroke="#db2777" stroke-dasharray="3,3" stroke-width="1.5"/>
    <rect x="40" y="65" width="75" height="26" rx="13" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
    <text x="77.5" y="82" font-weight="bold" fill="#9d174d">Pooja</text>
    <line x1="115" y1="91" x2="115" y2="115" stroke="#64748b" stroke-width="1.5"/>
    <!-- Ravi -->
    <rect x="80" y="115" width="70" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="115" y="132" font-weight="bold" fill="#1d4ed8">Ravi (Son)</text>
    <text x="200" y="132" font-size="11" fill="#059669" font-weight="bold">Karan is Father</text>
  </g>

</svg>