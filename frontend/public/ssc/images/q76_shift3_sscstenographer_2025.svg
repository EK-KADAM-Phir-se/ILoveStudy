<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 120" width="100%" height="120" style="background:#ffffff; border-radius:8px;">
    <style>
      .orig-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 32px; fill: #1e293b; letter-spacing: 4px; }
      .reflected-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 32px; fill: #94a3b8; letter-spacing: 4px; opacity: 0.7; }
    </style>
    <!-- Original Text -->
    <text x="175" y="45" text-anchor="middle" class="orig-text">US91Q4M5W3</text>

    <!-- Mirror Dotted Line -->
    <line x1="30" y1="60" x2="320" y2="60" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Water/Reflected Text -->
    <g transform="translate(175, 60) scale(1, -1) translate(-175, -50)">
      <text x="175" y="45" text-anchor="middle" class="reflected-text">US91Q4M5W3</text>
    </g>
  </svg>