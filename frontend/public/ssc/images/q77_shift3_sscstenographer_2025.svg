<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 160" width="100%" height="160">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <!-- Sheet X -->
  <g transform="translate(20, 20)" stroke="#1e293b" stroke-width="2" fill="#f8fafc">
    <rect x="30" y="0" width="30" height="30"/>
    <rect x="0" y="30" width="30" height="30"/>
    <text x="10" y="52" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b" stroke="none">+</text>
    <rect x="30" y="30" width="30" height="30" fill="#334155"/>
    <rect x="60" y="30" width="30" height="30"/>
    <circle cx="75" cy="45" r="5" fill="#1e293b"/>
    <rect x="30" y="60" width="30" height="30"/>
    <rect x="30" y="90" width="30" height="30"/>
    <text x="45" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" stroke="none">Sheet (X)</text>
  </g>
  <!-- 3D Cube Options -->
  <g transform="translate(150, 30)" stroke="#1e293b" stroke-width="2" fill="#ffffff">
    <!-- Cube A -->
    <g transform="translate(0, 0)">
      <polygon points="20,30 45,15 70,30 45,45"/>
      <polygon points="20,30 45,45 45,75 20,60"/>
      <polygon points="70,30 45,45 45,75 70,60"/>
      <text x="45" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" stroke="none">A</text>
    </g>
    <!-- Cube B -->
    <g transform="translate(80, 0)">
      <polygon points="20,30 45,15 70,30 45,45" fill="#334155"/>
      <polygon points="20,30 45,45 45,75 20,60"/>
      <polygon points="70,30 45,45 45,75 70,60"/>
      <text x="45" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" stroke="none">B</text>
    </g>
  </g>
</svg>