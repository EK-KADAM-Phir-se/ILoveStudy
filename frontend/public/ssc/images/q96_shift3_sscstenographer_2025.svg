<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" width="100%" height="110">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <g transform="translate(10, 15)" stroke="#1e293b" stroke-width="2.5" fill="none">
    <!-- Shape A: Circle -->
    <g transform="translate(0, 0)">
      <circle cx="35" cy="35" r="25" stroke="#ef4444" stroke-width="3"/>
      <text x="35" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ef4444" stroke="none">A (Curved)</text>
    </g>
    <!-- Shape B: Pentagon -->
    <g transform="translate(90, 0)">
      <polygon points="35,10 55,25 45,55 25,55 15,25"/>
      <text x="35" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" stroke="none">B</text>
    </g>
    <!-- Shape C: Triangle -->
    <g transform="translate(180, 0)">
      <polygon points="35,10 10,55 60,55"/>
      <text x="35" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" stroke="none">C</text>
    </g>
    <!-- Shape D: Rectangle -->
    <g transform="translate(270, 0)">
      <rect x="10" y="15" width="50" height="40"/>
      <text x="35" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" stroke="none">D</text>
    </g>
  </g>
</svg>