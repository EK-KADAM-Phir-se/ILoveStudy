<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="130">
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>
  <!-- Figure A -->
  <g transform="translate(20, 20)">
    <rect width="80" height="80" fill="#ffffff" stroke="#334155" stroke-width="2.5" rx="6"/>
    <polygon points="40,20 20,60 60,60" fill="#334155"/>
    <text x="35" y="98" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">A</text>
  </g>
  <text x="115" y="68" font-family="sans-serif" font-size="22" font-weight="bold" fill="#475569">:</text>
  <!-- Figure B -->
  <g transform="translate(135, 20)">
    <rect width="80" height="80" fill="#ffffff" stroke="#334155" stroke-width="2.5" rx="6"/>
    <polygon points="40,20 20,60 60,60" fill="none" stroke="#334155" stroke-width="2.5"/>
    <text x="35" y="98" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">B</text>
  </g>
  <text x="235" y="68" font-family="sans-serif" font-size="22" font-weight="bold" fill="#475569">::</text>
  <!-- Figure C -->
  <g transform="translate(265, 20)">
    <rect width="80" height="80" fill="#ffffff" stroke="#334155" stroke-width="2.5" rx="6"/>
    <rect x="25" y="25" width="30" height="30" fill="#334155"/>
    <text x="35" y="98" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">C</text>
  </g>
  <text x="360" y="68" font-family="sans-serif" font-size="22" font-weight="bold" fill="#475569">:</text>
  <!-- Figure ? -->
  <g transform="translate(390, 20)">
    <rect width="80" height="80" fill="#ffffff" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4,4" rx="6"/>
    <text x="33" y="52" font-family="sans-serif" font-size="28" font-weight="bold" fill="#6366f1">?</text>
  </g>
</svg>