<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="260" height="200">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <g stroke="#1e293b" stroke-width="2" fill="#f1f5f9">
    <!-- Unfolded Cube Net -->
    <rect x="90" y="10" width="40" height="40"/>
    <circle cx="110" cy="30" r="4" fill="#1e293b"/>
    
    <rect x="50" y="50" width="40" height="40"/>
    <text x="65" y="75" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b" stroke="none">+</text>

    <rect x="90" y="50" width="40" height="40" fill="#334155"/>
    <circle cx="110" cy="70" r="6" fill="#ffffff" stroke="none"/>

    <rect x="130" y="50" width="40" height="40"/>
    <rect x="145" y="65" width="10" height="10" fill="#1e293b"/>

    <rect x="90" y="90" width="40" height="40"/>
    <line x1="90" y1="90" x2="130" y2="130"/>

    <rect x="90" y="130" width="40" height="40"/>
    <circle cx="100" cy="140" r="3" fill="#1e293b"/>
    <circle cx="120" cy="160" r="3" fill="#1e293b"/>
  </g>
</svg>