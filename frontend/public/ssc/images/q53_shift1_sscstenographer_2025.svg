<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" width="100%" height="100%">
  <style>
    .th { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
    .td { font-family: sans-serif; font-size: 13px; fill: #334155; }
    .line { stroke: #cbd5e1; stroke-width: 1; }
    .bg-head { fill: #f1f5f9; }
  </style>

  <rect width="450" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Table Header -->
  <rect x="10" y="10" width="430" height="35" rx="4" class="bg-head"/>
  <text x="30" y="32" class="th">Operation preference wise</text>
  <text x="310" y="32" class="th">Symbol</text>
  <line x1="10" y1="45" x2="440" y2="45" class="line"/>

  <!-- Row 1 -->
  <text x="30" y="70" class="td">Brackets</text>
  <text x="310" y="70" class="td">[ ] , { } , ( )</text>
  <line x1="10" y1="80" x2="440" y2="80" class="line"/>

  <!-- Row 2 -->
  <text x="30" y="100" class="td">Orders, of</text>
  <text x="310" y="100" class="td">(power), √(root), of</text>
  <line x1="10" y1="110" x2="440" y2="110" class="line"/>

  <!-- Row 3 -->
  <text x="30" y="130" class="td">Division / Multiplication</text>
  <text x="310" y="130" class="td">÷  ,  ×</text>
  <line x1="10" y1="140" x2="440" y2="140" class="line"/>

  <!-- Row 4 -->
  <text x="30" y="160" class="td">Addition / Subtraction</text>
  <text x="310" y="160" class="td">+  ,  -</text>

  <!-- Vertical Divider -->
  <line x1="280" y1="10" x2="280" y2="190" class="line"/>
</svg>
