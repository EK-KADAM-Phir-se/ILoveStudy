<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 80" width="100%" height="100%">
  <style>
    .sq-open { fill: #ffffff; stroke: #1e293b; stroke-width: 2; }
    .sq-filled { fill: #1e293b; stroke: #1e293b; stroke-width: 2; }
    .txt { font-family: sans-serif; font-size: 11px; fill: #64748b; font-weight: bold; text-anchor: middle; }
  </style>

  <rect width="500" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 1st pair: 2 open, 1 filled -->
  <rect x="20" y="20" width="30" height="30" class="sq-open"/>
  <rect x="55" y="20" width="30" height="30" class="sq-open"/>
  <rect x="90" y="20" width="30" height="30" class="sq-filled"/>
  <text x="35" y="65" class="txt">1st</text>
  <text x="70" y="65" class="txt">2nd</text>
  <text x="105" y="65" class="txt">3rd</text>

  <!-- 2nd pair: 2 open, 1 filled -->
  <rect x="135" y="20" width="30" height="30" class="sq-open"/>
  <rect x="170" y="20" width="30" height="30" class="sq-open"/>
  <rect x="205" y="20" width="30" height="30" class="sq-filled"/>
  <text x="150" y="65" class="txt">4th</text>
  <text x="185" y="65" class="txt">5th</text>
  <text x="220" y="65" class="txt">6th</text>

  <!-- 3rd pair: 2 open, 1 filled -->
  <rect x="250" y="20" width="30" height="30" class="sq-open"/>
  <rect x="285" y="20" width="30" height="30" class="sq-open"/>
  <rect x="320" y="20" width="30" height="30" class="sq-filled"/>
  <text x="265" y="65" class="txt">7th</text>
  <text x="300" y="65" class="txt">8th</text>
  <text x="335" y="65" class="txt">9th</text>

  <!-- 4th pair: 2 open, 1 filled (Breaks at 11th - filled shown incorrectly) -->
  <rect x="365" y="20" width="30" height="30" class="sq-open"/>
  <rect x="400" y="20" width="30" height="30" class="sq-filled"/>
  <rect x="435" y="20" width="30" height="30" class="sq-open"/>
  <text x="380" y="65" class="txt">10th</text>
  <text x="415" y="65" class="txt" fill="#ef4444">11th ✗</text>
  <text x="450" y="65" class="txt">12th</text>
</svg>
