<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%" height="110" style="background:#0f172a; border-radius:8px;">
    <style>.box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 4; } .txt { font-family: sans-serif; font-size: 16px; fill: #f8fafc; text-anchor: middle; font-weight: bold; }</style>
    <rect x="10" y="20" width="60" height="70" class="box"/>
    <text x="40" y="60" class="txt">A</text>

    <rect x="80" y="20" width="60" height="70" class="box"/>
    <text x="110" y="60" class="txt">B</text>

    <rect x="180" y="20" width="60" height="70" class="box"/>
    <text x="210" y="60" class="txt">C</text>

    <rect x="250" y="20" width="60" height="70" class="box" style="stroke:#eab308; stroke-dasharray:4;"/>
    <text x="280" y="60" class="txt" fill="#eab308">?</text>
  </svg>