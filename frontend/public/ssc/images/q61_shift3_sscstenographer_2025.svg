<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="100%" height="220" style="background:#ffffff; border-radius:8px;">
    <style>
      .heart-path { fill: none; stroke: #1e293b; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
      .inner-line { fill: none; stroke: #1e293b; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    </style>
    <!-- Outer Heart Outline -->
    <path d="M 150 225 L 75 140 C 30 90 40 35 90 35 C 120 35 140 55 150 70 C 160 55 180 35 210 35 C 260 35 270 90 225 140 Z" class="heart-path"/>
    
    <!-- Left lobe internal lines forming triangles -->
    <line x1="90" y1="35" x2="52" y2="105" class="inner-line"/>
    <line x1="90" y1="35" x2="70" y2="155" class="inner-line"/>
    <line x1="52" y1="105" x2="70" y2="155" class="inner-line"/>
    <line x1="90" y1="35" x2="100" y2="50" class="inner-line"/>
    <line x1="100" y1="50" x2="70" y2="155" class="inner-line"/>
    <line x1="100" y1="50" x2="140" y2="115" class="inner-line"/>
    <line x1="70" y1="155" x2="140" y2="115" class="inner-line"/>

    <!-- Right lobe internal rectangle with diagonals and midline -->
    <line x1="140" y1="115" x2="150" y2="70" class="inner-line"/>
    <line x1="150" y1="70" x2="250" y2="70" class="inner-line"/>
    <line x1="250" y1="70" x2="245" y2="115" class="inner-line"/>
    <line x1="245" y1="115" x2="140" y2="115" class="inner-line"/>
    
    <!-- Diagonals of rectangle -->
    <line x1="150" y1="70" x2="245" y2="115" class="inner-line"/>
    <line x1="250" y1="70" x2="140" y2="115" class="inner-line"/>
    <!-- Midline of rectangle -->
    <line x1="140" y1="115" x2="250" y2="70" class="inner-line"/>
  </svg>