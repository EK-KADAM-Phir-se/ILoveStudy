<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 180" width="100%" height="160" style="background:#0f172a; border-radius:8px;">
    <style>.box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; } .lbl { font-family: sans-serif; font-size: 14px; fill: #f8fafc; text-anchor: middle; font-weight: bold; }</style>
    <!-- Folded sheet net -->
    <g transform="translate(20, 10)">
      <rect x="30" y="10" width="25" height="25" class="box"/><rect x="30" y="35" width="25" height="25" class="box"/><text x="42.5" y="52" class="lbl">★</text>
      <rect x="30" y="60" width="25" height="25" class="box"/><text x="42.5" y="77" class="lbl">⊕</text>
      <rect x="30" y="85" width="25" height="25" class="box"/>
    </g>
    <!-- Formed cubes A, B, C, D -->
    <g transform="translate(130, 60)">
      <rect x="0" y="0" width="40" height="40" class="box"/><text x="20" y="60" class="lbl">A</text>
      <rect x="50" y="0" width="40" height="40" class="box"/><text x="70" y="60" class="lbl">B</text>
      <rect x="100" y="0" width="40" height="40" class="box"/><text x="120" y="60" class="lbl">C</text>
      <rect x="150" y="0" width="40" height="40" class="box"/><text x="170" y="60" class="lbl">D</text>
    </g>
  </svg>