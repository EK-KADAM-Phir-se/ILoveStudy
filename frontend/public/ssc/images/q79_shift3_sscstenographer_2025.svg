<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="100%" height="200" style="background:#ffffff; border-radius:8px;">
    <style>
      .pyramid-line { fill: none; stroke: #1e293b; stroke-width: 3; stroke-linejoin: round; }
      .lbl { font-family: sans-serif; font-size: 13px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
    </style>
    <!-- Central Square -->
    <rect x="70" y="60" width="80" height="80" class="pyramid-line"/>
    <!-- 4 Triangles on 4 sides -->
    <polygon points="70 60, 150 60, 110 15" class="pyramid-line"/>
    <polygon points="150 60, 150 140, 195 100" class="pyramid-line"/>
    <polygon points="70 140, 150 140, 110 185" class="pyramid-line"/>
    <polygon points="70 60, 70 140, 25 100" class="pyramid-line"/>
    <text x="110" y="210" class="lbl">2D Net of Square Pyramid</text>
  </svg>