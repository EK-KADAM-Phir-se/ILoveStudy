<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" width="100%" height="110">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <g transform="translate(10, 15)" stroke="#1e293b" stroke-width="2" fill="none">
    <!-- Shape A: Triangle (3 sides, 3 arrows) -->
    <g transform="translate(0, 0)">
      <polygon points="35,15 15,55 55,55"/>
      <line x1="35" y1="15" x2="35" y2="5"/>
      <line x1="15" y1="55" x2="5" y2="60"/>
      <line x1="55" y1="55" x2="65" y2="60"/>
      <text x="35" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" stroke="none">A</text>
    </g>
    <!-- Shape B: Pentagon (5 sides, 5 arrows) -->
    <g transform="translate(90, 0)">
      <polygon points="35,15 55,30 45,55 25,55 15,30"/>
      <text x="35" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" stroke="none">B</text>
    </g>
    <!-- Shape C: Diamond (4 sides, 2 arrows) -->
    <g transform="translate(180, 0)">
      <polygon points="35,15 55,35 35,55 15,35" stroke="#ef4444" stroke-width="3"/>
      <line x1="35" y1="15" x2="35" y2="5" stroke="#ef4444" stroke-width="3"/>
      <line x1="35" y1="55" x2="35" y2="65" stroke="#ef4444" stroke-width="3"/>
      <text x="35" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ef4444" stroke="none">C (Odd)</text>
    </g>
    <!-- Shape D: Square (4 sides, 4 arrows) -->
    <g transform="translate(270, 0)">
      <rect x="15" y="15" width="40" height="40"/>
      <line x1="15" y1="15" x2="5" y2="5"/>
      <line x1="55" y1="15" x2="65" y2="5"/>
      <line x1="15" y1="55" x2="5" y2="65"/>
      <line x1="55" y1="55" x2="65" y2="65"/>
      <text x="35" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" stroke="none">D</text>
    </g>
  </g>
</svg>