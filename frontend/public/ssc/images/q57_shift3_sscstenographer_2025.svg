<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <g stroke="#1e293b" stroke-width="2">
    <!-- Outer Box -->
    <rect x="10" y="10" width="200" height="200" fill="none" stroke-width="3"/>
    <!-- Vertical lines -->
    <line x1="50" y1="10" x2="50" y2="210"/>
    <line x1="90" y1="10" x2="90" y2="210"/>
    <line x1="130" y1="10" x2="130" y2="210"/>
    <line x1="170" y1="10" x2="170" y2="210"/>
    <!-- Horizontal lines -->
    <line x1="10" y1="50" x2="210" y2="50"/>
    <line x1="10" y1="90" x2="210" y2="90"/>
    <line x1="10" y1="130" x2="210" y2="130"/>
    <line x1="10" y1="170" x2="210" y2="170"/>
  </g>
</svg>